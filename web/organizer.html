<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew organizer</title>
<link rel="stylesheet" href="/static/crew.css">
</head>
<body>
<div class="split">
  <section class="side stack">
    <div>
      <h3>Organizer</h3>
      <h2>Publish your agenda</h2>
      <p class="muted small">Crew scrapes the page live with Bright Data, extracts every session, speaker and technology,
        and adds them to the shared graph. Teams who sign up are matched against it.</p>
    </div>
    <div>
      <label for="name">Event name</label>
      <input type="text" id="name" placeholder="GitHub Universe 2026">
    </div>
    <div>
      <label for="urls">Agenda page URLs, one per line</label>
      <textarea id="urls" placeholder="https://githubuniverse.com/agenda"></textarea>
    </div>
    <div class="row">
      <button class="btn big" id="publish">Publish agenda</button>
      <button class="btn ghost" id="sample" title="Four made-up sessions, for offline testing">Use sample agenda</button>
    </div>
    <div class="feed" id="feed"></div>
    <div id="out"></div>
  </section>
  <iframe src="/viz" title="Live graph"></iframe>
</div>
<script src="/static/crew.js"></script>
<script>
Crew.nav("/organizer");
const $ = id => document.getElementById(id);

Crew.api("/api/setup").then(({ event }) => {
  if (!event) return;
  $("name").value = event.name || "";
  $("urls").value = (event.urls || []).join("\n");
});

async function publish(sample) {
  const payload = { name:$("name").value, urls:$("urls").value.split("\n"), sample };
  const buttons = [$("publish"), $("sample")];
  buttons.forEach(b => b.disabled = true);
  $("out").innerHTML = "";
  try {
    const result = await Crew.runBuild("event", payload, $("feed"));
    $("out").innerHTML = `<div class="card stack">
      <h2>${result.sessions} sessions published</h2>
      <p class="muted small">Put a sticker on each door so attendees can tap in. Then send teams to onboarding.</p>
      <div class="row"><a class="btn" href="/stickers">Print sticker sheet</a><a class="btn ghost" href="/team">Team onboarding</a></div>
    </div>`;
  } catch (e) {
    $("out").innerHTML = `<p class="err">${Crew.esc(e.message)}</p>`;
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}
$("publish").onclick = () => publish(false);
$("sample").onclick = () => publish(true);
</script>
</body>
</html>
