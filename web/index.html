<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --hot:#f7b955; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif, system-ui, sans-serif;
         display:grid; grid-template-columns: 1fr 380px; height:100vh; }
  #net { height:100vh; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:20px; overflow:auto; }
  h1 { font-size:18px; margin:0 0 4px; } h1 span { color:var(--hot); }
  .sub { color:var(--muted); margin-bottom:18px; }
  #title { font-size:16px; font-weight:600; margin:0 0 12px; min-height:22px; }
  .path { border:1px solid var(--line); border-left:3px solid var(--hot); border-radius:6px; padding:10px 12px;
          margin-bottom:10px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; }
  .empty { color:var(--muted); font-style:italic; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:22px; color:var(--muted); font-size:12px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  #stats { color:var(--muted); font-size:12px; margin-top:12px; }
  .toggle { margin-top:10px; font:500 12px/1 inherit; color:var(--text); background:none; cursor:pointer;
            border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  .toggle:hover { border-color:var(--hot); }
  @media (max-width: 800px) { body { grid-template-columns:1fr; grid-template-rows: 60vh auto; } #net { height:60vh; } }
</style>
</head>
<body>
<div id="net"></div>
<aside>
  <h1>Crew <span>●</span> team graph</h1>
  <div class="sub">Every answer is a path. The highlighted one is the latest.</div>
  <div id="title"></div>
  <div id="paths"><div class="empty">Ask Crew something to light up a path.</div></div>
  <div class="legend" id="legend"></div>
  <div id="stats"></div>
  <button id="focus" class="toggle" type="button"></button>
</aside>
<script>
const COLORS = { Person:"#f7b955", Repo:"#58a6ff", Package:"#3fb950", Topic:"#a371f7", Session:"#ff7b72",
                 Speaker:"#ffa657", Note:"#79c0ff", Source:"#8b949e", Digest:"#6e7681" };
const DIM = "rgba(110,118,129,0.25)";
const nodes = new vis.DataSet(), edges = new vis.DataSet();
const network = new vis.Network(document.getElementById("net"), { nodes, edges }, {
  nodes: { shape:"dot", size:10, font:{ color:"#c9d1d9", size:12, strokeWidth:3, strokeColor:"#0d1117" } },
  edges: { arrows:{ to:{ enabled:true, scaleFactor:0.4 } }, color:{ color:DIM }, width:1,
           font:{ color:"#8b949e", size:9, strokeWidth:0, align:"middle" }, smooth:{ type:"continuous" } },
  physics: { stabilization:{ iterations:200 }, barnesHut:{ gravitationalConstant:-6000, springLength:120 } },
  interaction: { hover:true },
});
document.getElementById("legend").innerHTML =
  Object.entries(COLORS).map(([k, c]) => `<span><i style="background:${c}"></i>${k}</span>`).join("");

let graphSig = "", lastHighlight = 0, hot = { nodes:new Set(), edges:new Set() };

function styleNode(n) {
  const isHot = hot.nodes.has(n.id), anyHot = hot.nodes.size > 0;
  const c = COLORS[n.label] || "#c9d1d9";
  return { id:n.id, label:n.name, title:`${n.label}: ${n.name}`,
           color:{ background: anyHot && !isHot ? DIM : c, border: isHot ? "#ffffff" : c },
           size: isHot ? 18 : (n.label === "Person" ? 14 : 9), borderWidth: isHot ? 3 : 1,
           font:{ color: anyHot && !isHot ? "rgba(201,209,217,0.3)" : "#e6edf3", size: isHot ? 14 : 11 } };
}
function styleEdge(e) {
  const isHot = hot.edges.has(e.id);
  return { id:e.id, from:e.src, to:e.dst, label: isHot ? e.type : "",
           color:{ color: isHot ? "#f7b955" : DIM }, width: isHot ? 3 : 1 };
}
let raw = { nodes:[], edges:[] };
function render() {
  nodes.update(raw.nodes.map(styleNode));
  edges.update(raw.edges.map(styleEdge));
}
// Focus mode (default) shows bridges only: what connects the team's code to the conference.
let focusMode = true;
try { focusMode = localStorage.getItem("crew.viz.focus") !== "0"; } catch (e) {}
const focusBtn = document.getElementById("focus");
function paintFocus() { focusBtn.textContent = focusMode ? "Showing bridges only · show everything" : "Showing everything · bridges only"; }
focusBtn.onclick = () => {
  focusMode = !focusMode; paintFocus(); graphSig = "";
  try { localStorage.setItem("crew.viz.focus", focusMode ? "1" : "0"); } catch (e) {}
  loadGraph();
};
paintFocus();
async function loadGraph() {
  const g = await (await fetch(`/api/graph?focus=${focusMode ? 1 : 0}`)).json();
  const sig = g.nodes.length + ":" + g.edges.length;
  if (sig === graphSig) return;
  graphSig = sig; raw = g;
  const ids = new Set(g.nodes.map(n => n.id)), eids = new Set(g.edges.map(e => e.id));
  nodes.remove(nodes.getIds().filter(id => !ids.has(id)));
  edges.remove(edges.getIds().filter(id => !eids.has(id)));
  render();
  document.getElementById("stats").textContent = g.total && g.total.nodes !== g.nodes.length
    ? `${g.nodes.length} of ${g.total.nodes} nodes · ${g.edges.length} edges`
    : `${g.nodes.length} nodes · ${g.edges.length} edges`;
}
async function loadHighlight() {
  const h = await (await fetch("/api/highlight")).json();
  if (!h.at || h.at === lastHighlight) return;
  lastHighlight = h.at;
  hot = { nodes:new Set(), edges:new Set() };
  h.paths.forEach(p => { p.nodes.forEach(n => hot.nodes.add(n.id)); p.edges.forEach(e => hot.edges.add(e.id)); });
  document.getElementById("title").textContent = h.title;
  const box = document.getElementById("paths");
  box.innerHTML = h.paths.length
    ? h.paths.map(p => `<div class="path"></div>`).join("")
    : `<div class="empty">No path found — and that's the answer.</div>`;
  box.querySelectorAll(".path").forEach((el, i) => el.textContent = h.paths[i].text);
  await loadGraph(); render();
  if (hot.nodes.size) network.fit({ nodes:[...hot.nodes].filter(id => nodes.get(id)), animation:{ duration:600 } });
}
async function tick() { try { await loadGraph(); await loadHighlight(); } catch (e) { console.warn(e); } }
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
