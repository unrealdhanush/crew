[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crew"
version = "0.1.0"
description = "Send four people to a conference, bring back one brain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["falkordb>=1.0", "fastmcp>=2.10", "openai>=1.40", "httpx>=0.27", "trueforge-sdk>=0.180"]

[project.scripts]
crew = "crew.cli:main"

[tool.setuptools]
packages = ["crew"]
